<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Moviq · Arma tu entrenamiento en 2 minutos</title>
    <meta name="description" content="Responde unas preguntas y recibe un plan de entrenamiento hecho para ti." />
    <link rel="stylesheet" href="style.css?v=12" />
    <link rel="preload" as="image" href="img/sexo-m.webp?v=7" />
    <link rel="preload" as="image" href="img/sexo-f.webp?v=7" />

    <!--
      QUIZ EN ESPAÑOL (quiz.moviqgym.app/es; rewrite em next.config.mjs)
      Mesmo quiz do português (quiz-tela.js), com os textos de quiz-dados-es.js e window.MOVIQ_LANG = 'es'.
      O config.js do português é carregado primeiro (Supabase, URL do checkout) e o bloco abaixo troca só o que muda aqui.

      OFERTA (escolhida por HOTMART_ES logo abaixo):
        - HOTMART_ES preenchido: ACESSO VITALÍCIO, pagamento único pela Hotmart (cartão e meios de pagamento locais,
          na moeda do país). Produto próprio em espanhol na Hotmart; o app libera o acesso pelo /api/hotmart/webhook
          (ID do produto em HOTMART_PRODUTO_VITALICIO_ES na Vercel). Passo a passo em HOTMART.md, "Quiz em espanhol".
        - HOTMART_ES vazio: assinatura mensal de US$ 5 pela Stripe (plano '1m_usd' = STRIPE_PRICE_1M_USD na Vercel,
          produto "Moviq · Plan mensual"), como era até 23/11/2026 (4 vendas com R$ 357 de anúncio em 3 dias).
      PIXEL: pixel da Utmify do dashboard GLOBAL OF 2 (abaixo), que leva ao pixel da Meta "MOVIQ APP ES"
      (974150118749887). PageView sai da Utmify; QuizStep, Lead e InitiateCheckout saem do quiz-tela.js pelo fbq
      que ela define (IC_PELO_QUIZ abaixo). A Compra: Hotmart = Utmify, pelo webhook "GLOBAL OF 2 PRINCIPAL" da
      Hotmart (o produto 9053615 não tem pixel próprio na Hotmart, para não contar a compra duas vezes);
      Stripe = API de Conversões do app (META_PIXEL_ID_ES / META_CAPI_TOKEN_ES).
      UTMIFY: pixel + script de UTMs (as UTMs do anúncio seguem até a Stripe ou no link da Hotmart).
    -->
    <script src="config.js?v=18"></script>
    <script>
      window.MOVIQ_LANG = 'es';
      // Link do checkout do produto em espanhol na Hotmart (Produtos > produto > Links > "Link do checkout").
      // Vazio: segue a assinatura de US$ 5 pela Stripe.
      var HOTMART_ES = 'https://pay.hotmart.com/J108632542Q'; // produto 9053615, US$ 9,90 à vista
      var VITALICIO_ES_USD = 9.9; // SÓ PARA MOSTRAR: precisa ser igual ao preço do produto na Hotmart

      Object.assign(window.MOVIQ_CONFIG, {
        MOEDA: 'USD',
        GARANTIA_DIAS: 7,
        // Sem regra de clique de IC na Utmify do GLOBAL OF 2: o próprio quiz manda o InitiateCheckout (fbq) ao tocar no botão
        IC_PELO_QUIZ: true,
      });
      if (HOTMART_ES) {
        Object.assign(window.MOVIQ_CONFIG, {
          GATEWAY: 'hotmart',
          HOTMART_LINKS: { vitalicio: HOTMART_ES },
          OFERTA_VITALICIA: { ativa: true, total: VITALICIO_ES_USD },
          AVISO_VITALICIO: 'Pago único con tarjeta o medios de pago de tu país. Sin mensualidad y sin renovación automática.',
          PREMIUM: { ativa: false }, // pop-up do Premium é só do quiz em português (Stripe, em reais)
        });
      } else {
        Object.assign(window.MOVIQ_CONFIG, {
          GATEWAY: 'stripe',
          OFERTA_VITALICIA: { ativa: false },
          // total: SÓ PARA MOSTRAR; o valor cobrado é o preço da Stripe (US$ 5,00/mês, price_1Ue1NBQfnCdLHlDYBsYb2hPk)
          PLANOS: [{ meses: 1, total: 5, plano: '1m_usd', destaque: true }],
          AVISO_ASSINATURA: 'Suscripción mensual con renovación automática. Cancela cuando quieras.',
        });
      }
    </script>

    <!--
      Pixel da Utmify do dashboard GLOBAL OF 2 ("MOVIQ APP ES", pixelId 6b04cd5eac9e35657ac48eb1). O código do
      painel vinha embaralhado; este é o mesmo, legível: carrega https://cdn.utmify.com.br/scripts/pixel/pixel.js
      com window.pixelId. Ele carrega o pixel da Meta configurado na Utmify (974150118749887), manda o PageView
      pelo navegador e pelo servidor (com o mesmo ID, sem contar duas vezes) e define o fbq que o quiz usa para
      QuizStep, Lead e InitiateCheckout. Não coloque outro fbq('init')/PageView aqui: duplicaria o PageView.
    -->
    <script>
      window.pixelId = '6b04cd5eac9e35657ac48eb1';
      (function () {
        var s = document.createElement('script');
        s.src = 'https://cdn.utmify.com.br/scripts/pixel/pixel.js';
        s.async = true;
        s.defer = true;
        (document.head || document.documentElement).appendChild(s);
      })();
    </script>
    <script>
      (function () {
        // Mesmo modo do index.html: Stripe leva as UTMs na sessão; Hotmart, no xcod/sck do link de pagamento
        var hotmart = (window.MOVIQ_CONFIG || {}).GATEWAY === 'hotmart';
        var s = document.createElement('script');
        s.src = 'https://cdn.utmify.com.br/scripts/utms/latest.js';
        s.async = true;
        s.defer = true;
        s.setAttribute('data-utmify-prevent-subids', '');
        if (!hotmart) {
          s.setAttribute('data-utmify-prevent-xcod-sck', '');
          s.setAttribute('data-utmify-is-stripe', '');
        }
        (document.head || document.documentElement).appendChild(s);
        var pre = document.createElement('link');
        pre.rel = 'preconnect';
        pre.href = hotmart ? 'https://pay.hotmart.com' : 'https://checkout.stripe.com';
        document.head.appendChild(pre);
      })();
    </script>
  </head>
  <body>
    <div id="quiz" class="quiz"></div>
    <noscript><p style="padding:24px;text-align:center">Activa JavaScript para hacer el quiz.</p></noscript>

    <script src="quiz-dados-es.js?v=2"></script>
    <script src="quiz-tela.js?v=23"></script>
  </body>
</html>
