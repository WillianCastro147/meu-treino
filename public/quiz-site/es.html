<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Moviq · Arma tu entrenamiento en 2 minutos</title>
    <meta name="description" content="Responde unas preguntas y recibe un plan de entrenamiento hecho para ti." />
    <link rel="stylesheet" href="style.css?v=11" />
    <link rel="preload" as="image" href="img/sexo-m.webp?v=7" />
    <link rel="preload" as="image" href="img/sexo-f.webp?v=7" />

    <!--
      QUIZ EN ESPAÑOL (quiz.moviqgym.app/es; rewrite em next.config.mjs)
      Mesmo quiz do português (quiz-tela.js), com os textos de quiz-dados-es.js e window.MOVIQ_LANG = 'es'.
      Oferta: assinatura mensal de US$ 5 (plano '1m_usd' = STRIPE_PRICE_1M_USD na Vercel, produto
      "Moviq · Plan mensual" na Stripe). O config.js do português é carregado primeiro (Supabase, URL do checkout)
      e o bloco abaixo troca só o que muda aqui.
      PIXEL: pixel próprio da Meta, "MOVIQ APP ES" (974150118749887), direto na página (sem o pixel da Utmify,
      que manda para o pixel do Brasil). PageView aqui; QuizStep, Lead e InitiateCheckout saem do quiz-tela.js
      (IC_PELO_QUIZ abaixo). A Compra vai pela API de Conversões do app (META_PIXEL_ID_ES / META_CAPI_TOKEN_ES).
      UTMIFY: só o script de UTMs (as UTMs do anúncio seguem até a Stripe).
    -->
    <script src="config.js?v=17"></script>
    <script>
      window.MOVIQ_LANG = 'es';
      Object.assign(window.MOVIQ_CONFIG, {
        GATEWAY: 'stripe',
        MOEDA: 'USD',
        OFERTA_VITALICIA: { ativa: false },
        // total: SÓ PARA MOSTRAR; o valor cobrado é o preço da Stripe (US$ 5,00/mês, price_1Ue1NBQfnCdLHlDYBsYb2hPk)
        PLANOS: [{ meses: 1, total: 5, plano: '1m_usd', destaque: true }],
        AVISO_ASSINATURA: 'Suscripción mensual con renovación automática. Cancela cuando quieras.',
        GARANTIA_DIAS: 7,
        // Sem a regra de clique da Utmify aqui: o próprio quiz manda o InitiateCheckout ao pixel ao tocar no botão
        IC_PELO_QUIZ: true,
      });
    </script>

    <!-- Meta Pixel: MOVIQ APP ES -->
    <script>
      !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
      n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
      document,'script','https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '974150118749887');
      fbq('track', 'PageView');
    </script>
    <script>
      (function () {
        var s = document.createElement('script');
        s.src = 'https://cdn.utmify.com.br/scripts/utms/latest.js';
        s.async = true;
        s.defer = true;
        s.setAttribute('data-utmify-prevent-subids', '');
        s.setAttribute('data-utmify-prevent-xcod-sck', '');
        s.setAttribute('data-utmify-is-stripe', '');
        (document.head || document.documentElement).appendChild(s);
        var pre = document.createElement('link');
        pre.rel = 'preconnect';
        pre.href = 'https://checkout.stripe.com';
        document.head.appendChild(pre);
      })();
    </script>
  </head>
  <body>
    <div id="quiz" class="quiz"></div>
    <noscript><p style="padding:24px;text-align:center">Activa JavaScript para hacer el quiz.</p></noscript>

    <script src="quiz-dados-es.js?v=1"></script>
    <script src="quiz-tela.js?v=21"></script>
  </body>
</html>
